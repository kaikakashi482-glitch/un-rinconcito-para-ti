<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para Dany 🌻</title>

    <link rel="stylesheet" href="style.css?v=4">
</head>


<body>

    <!-- =========================
         ESTRELLAS DEL FONDO
    ========================== -->

    <div id="estrellas"></div>


    <!-- =========================
         UNIVERSO
    ========================== -->

    <main class="universo">


        <!-- GALAXIA -->

        <canvas id="galaxiaCanvas"></canvas>


        <!-- EFECTO DEL CORAZÓN -->

        <div id="efectoEspecial"></div>


        <!-- FLORES -->

        <div id="flores"></div>


        <!-- FLOR SECRETA -->

        <button
            id="florSecreta"
            class="flor-secreta"
            aria-label="Flor secreta para Dany">
        </button>


        <!-- =========================
             MENSAJE CENTRAL
        ========================== -->

        <div class="mensaje-central">

            <h1>
                Para Dany 🌻
            </h1>

            <p>
                Una pequeña galaxia para una pequeña bu
            </p>

        </div>


        <!-- MENSAJE ESPECIAL -->

        <div
            id="fraseEspecial"
            class="frase-especial">
        </div>


        <!-- MENSAJES DE LAS FLORES -->

        <div
            id="mensajeFlor"
            class="mensaje-flor">
        </div>


        <!-- =========================
             MÚSICA
        ========================== -->

        <button
            id="botonMusica"
            class="boton-musica">

            ▶ Escuchar Serendipity

        </button>


        <!-- REPRODUCTOR DE SPOTIFY -->

        <div
            id="spotifyPlayer"
            class="spotify-player oculto">

            <iframe
                data-testid="embed-iframe"
                style="border-radius: 12px;"
                src="https://open.spotify.com/embed/track/61RvEx7GLYRHQhG7ldjJo1?utm_source=generator&si=e86ad79a0a134885"
                width="100%"
                height="152"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>

        </div>


        <!-- =========================
             PISTA INICIAL
        ========================== -->

        <div
            id="pistaInicial"
            class="pista-inicial">

            Toca las flores 🌻

        </div>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js?v=4"></script>

</body>

</html>
